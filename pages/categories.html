<body>

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="mark"><i class="bi bi-wallet2"></i></span>
      <span class="name">ExpenseTracker<small>Pro Edition</small></span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu</div>
      <a href="dashboard" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="transactions" class="sidebar-link"><i class="bi bi-arrow-left-right"></i> Transactions</a>
      <a href="subscriptions" class="sidebar-link"><i class="bi bi-arrow-repeat"></i> Subscriptions</a>
      <a href="analytics" class="sidebar-link"><i class="bi bi-bar-chart"></i> Analytics</a>
      <a href="reports" class="sidebar-link"><i class="bi bi-file-earmark-text"></i> Reports</a>
      <a href="categories" class="sidebar-link"><i class="bi bi-tags"></i> Categories</a>
      <a href="goals" class="sidebar-link"><i class="bi bi-star"></i> Goals</a>
      <div class="sidebar-section-label">Preferences</div>
      <a href="settings" class="sidebar-link"><i class="bi bi-gear"></i> Settings</a>
      <a href="about" class="sidebar-link"><i class="bi bi-info-circle"></i> About</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../" class="sidebar-link" style="padding-left:0"><i class="bi bi-box-arrow-left"></i> Back to home</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="menu-toggle" aria-label="Toggle menu"><i class="bi bi-list"></i></button>
        <div class="topbar-title">
          <h1>Categories</h1>
          <small>Organize how your income and expenses are grouped</small>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="quickThemeToggle" title="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <button class="btn btn-primary text-white d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#addCategoryModal"><i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Add Category</span></button>
      </div>
    </header>

    <main class="content">
      <h2 class="mb-3"><i class="bi bi-arrow-down-left-circle text-success"></i> Income Categories</h2>
      <div class="row g-3 mb-4" id="incomeGrid"></div>

      <h2 class="mb-3"><i class="bi bi-arrow-up-right-circle text-danger"></i> Expense Categories</h2>
      <div class="row g-3" id="expenseGrid"></div>
    </main>
  </div>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Add Custom Category</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addCategoryForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Category Type</label>
            <select class="form-select" name="type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" placeholder="e.g. Subscriptions" maxlength="30" required>
            <div class="invalid-feedback">Please enter a category name</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Color</label>
            <input type="color" class="form-control form-control-color" name="color" value="#2563EB" title="Choose a color">
          </div>
          <div class="mb-1">
            <label class="form-label">Icon</label>
            <div id="iconPicker" class="d-flex flex-wrap gap-2"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary text-white">Add Category</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/app.js"></script>
<script src="../js/category.js"></script>
</body>
</html>
