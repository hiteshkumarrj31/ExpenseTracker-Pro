  <div class="main">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="menu-toggle" aria-label="Toggle menu"><i class="bi bi-list"></i></button>
        <div class="topbar-title">
          <h1>Savings Goals</h1>
          <small>Track your savings and financial targets</small>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="quickThemeToggle" title="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <button class="btn btn-primary text-white d-flex align-items-center gap-1" id="addGoalBtn"><i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Add Goal</span></button>
      </div>
    </header>

    <main class="content">
      <div class="row g-4" id="goalsGrid">
        <!-- Goals injected here -->
      </div>
    </main>
  </div>
</div>

<!-- Add Goal Modal -->
<div class="modal fade" id="goalModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="goalModalTitle">Add Goal</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="goalForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Goal Name</label>
            <input type="text" class="form-control" name="name" required placeholder="e.g. New Phone">
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Target Amount</label>
              <input type="number" class="form-control" name="targetAmount" required min="1">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Deadline (Optional)</label>
              <input type="date" class="form-control" name="deadline">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Icon</label>
            <div class="d-flex flex-wrap gap-2" id="iconSelector"></div>
            <input type="hidden" name="icon" id="selectedIcon" value="bi-star">
          </div>
          <div class="mb-3">
            <label class="form-label">Color</label>
            <input type="color" class="form-control form-control-color" name="color" value="#10B981">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary text-white">Save Goal</button>
        </div>
      </form>
    </div>
  </div>
</div>
